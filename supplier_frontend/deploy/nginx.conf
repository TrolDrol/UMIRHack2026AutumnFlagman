server {
 listen 80;
 absolute_redirect off;
 server_tokens off;
 root /usr/share/nginx/html;
 include /etc/nginx/mime.types;
 location = /supplier { return 308 /supplier/; }
 location = /health { access_log off; return 200 'ok'; }
 location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
 location = /mockServiceWorker.js { add_header Cache-Control 'no-cache'; try_files $uri =404; }
 location ^~ /supplier/assets/ { try_files $uri =404; }
 location ^~ /integrations/ { default_type application/json; return 503 '{"error":{"code":"RETRY_LATER","message":"API is unavailable","details":{}},"meta":{"serverTime":"1970-01-01T00:00:00Z","requestId":"00000000-0000-4000-8000-000000000000"}}'; }
 location ^~ /api/ { default_type application/json; return 503 '{"error":{"code":"RETRY_LATER","message":"API is unavailable","details":{}},"meta":{"serverTime":"1970-01-01T00:00:00Z","requestId":"00000000-0000-4000-8000-000000000000"}}'; }
 location /supplier/ { try_files $uri $uri/ /supplier/index.html; }
 location / { return 404; }
}
