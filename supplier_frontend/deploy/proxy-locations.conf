# Include these locations in the shared portal-proxy server block.
# The upstream supplier-web resolves to the service on the shared Docker network.
location = /supplier { return 308 /supplier/; }
location ^~ /supplier/ {
    proxy_pass http://supplier-web:80;
    proxy_set_header Host $host;
}
# /mockServiceWorker.js must be served once from the shared MSW version at root.
# Route /integrations/ and /api/ to the live backend (URI preserved), or JSON 503
# in browser-demo. Never send these API locations to a SPA fallback.
