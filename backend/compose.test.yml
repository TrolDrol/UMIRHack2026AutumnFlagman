name: rims-backend-isolated
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rims_test
      POSTGRES_USER: rims_test
      POSTGRES_PASSWORD: ${RIMS_TEST_PASSWORD:?Set a password for the isolated database}
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["isolated-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rims_test -d rims_test"]
      interval: 3s
      timeout: 2s
      retries: 20
  migrate:
    build: { context: .., dockerfile: backend/Dockerfile }
    command: ["migrate"]
    environment:
      ConnectionStrings__Default: Host=db;Database=rims_test;Username=rims_test;Password=${RIMS_TEST_PASSWORD}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Database=rims_test;Username=rims_test;Password=${RIMS_TEST_PASSWORD}
      App__AllowedOrigins__0: http://localhost:5173
      App__AllowedOrigins__1: http://localhost:5174
      App__AllowedOrigins__2: http://localhost:8080
      App__MetricsEnabled: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["isolated-keys:/var/lib/rims/keys"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  isolated-postgres:
  isolated-keys:
