services:
  admin-web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        FRONTEND_MODE: demo
  customer-web:
    build:
      context: ../..
      dockerfile: customer_frontend/Dockerfile
      args:
        DEMO_MODE: "true"
  portal-proxy:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./proxy.demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-web
      - customer-web
