server {
  listen 80;
  resolver 127.0.0.11 valid=5s;
  set $customer_web http://customer-web;
  set $admin_web http://admin-web:8080;
  location = /client { return 308 /client/; }
  location /client/ { proxy_pass $customer_web$request_uri; }
  location = /mockServiceWorker.js { proxy_pass $customer_web$request_uri; add_header Cache-Control no-cache; }
  location /api/ { default_type application/json; return 503 '{"error":{"code":"RETRY_LATER","message":"Live API is not connected","details":{}},"meta":{"serverTime":"2026-10-11T00:00:00Z","requestId":"00000000-0000-4000-8000-000000000000"}}'; }
  location /integrations/ { default_type application/json; return 503 '{"error":{"code":"RETRY_LATER","message":"Live API is not connected","details":{}},"meta":{"serverTime":"2026-10-11T00:00:00Z","requestId":"00000000-0000-4000-8000-000000000000"}}'; }
  location / { proxy_pass $admin_web$request_uri; }
}
