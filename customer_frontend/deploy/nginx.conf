server {
 listen 80;
 absolute_redirect off;
 server_tokens off;
 root /usr/share/nginx/html;
 location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
 location = /client { return 308 /client/; }
 location = /mockServiceWorker.js { add_header Cache-Control no-cache; add_header Service-Worker-Allowed /; }
 location /client/assets/ { try_files $uri =404; }
 location ~ ^/client/.*\.(js|css|png|svg|jpg|jpeg|webp|woff2?)$ { try_files $uri =404; }
 location /client/ { try_files $uri $uri/ /client/index.html; }
 location /api/ { default_type application/json; return 503 '{"error":{"code":"RETRY_LATER","message":"API is not connected","details":{}},"meta":{"serverTime":"2026-10-11T00:00:00Z","requestId":"00000000-0000-4000-8000-000000000000"}}'; }
 location / { return 404; }
}
