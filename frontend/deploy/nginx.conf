server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location ~ ^/client(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $customer http://customer_frontend:80;
        proxy_pass $customer$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ~ ^/supplier(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $supplier http://supplier_frontend:80;
        proxy_pass $supplier$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(api/|integrations/v1/) {
        # Resolve only when requested; a backend is not required in demo mode.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
