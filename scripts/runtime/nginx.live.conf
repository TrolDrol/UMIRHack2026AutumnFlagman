map $http_x_forwarded_proto $rims_scheme {
    default $scheme;
    https https;
}
map $time_iso8601 $rims_server_time {
    ~^(?<rims_utc_time>.*)\+00:00$ "${rims_utc_time}Z";
    default $time_iso8601;
}
map $request_id $rims_request_uuid {
    '~^(?<rims_id_a>[0-9a-f]{8})(?<rims_id_b>[0-9a-f]{4})[0-9a-f](?<rims_id_c>[0-9a-f]{3})[0-9a-f](?<rims_id_d>[0-9a-f]{3})(?<rims_id_e>[0-9a-f]{12})$' "$rims_id_a-$rims_id_b-4$rims_id_c-8$rims_id_d-$rims_id_e";
    default $request_id;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ ^/(metrics|health)(/|$) { return 404; }
    location ~ ^/api/v2/(customer/)?warehouses/[0-9a-fA-F-]+/availability/ws$ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rims_scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/(api/|integrations/v1/) {
        # Only nginx-generated transport failures are mapped. Backend HTTP errors
        # retain their body/status because proxy_intercept_errors stays off.
        error_page 502 503 504 =503 @live_api_unavailable;
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 14s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rims_scheme;
        proxy_intercept_errors off;
    }
    location @live_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"error":{"code":"LIVE_API_UNAVAILABLE","message":"Live API temporarily unavailable","details":{}},"meta":{"serverTime":"$rims_server_time","requestId":"$rims_request_uuid"}}';
    }
    location ~ ^/client(/|$) {
        set $customer http://customer_frontend:80;
        proxy_pass $customer$request_uri;
        proxy_set_header Host $host;
    }
    location ~ ^/supplier(/|$) {
        set $supplier http://supplier_frontend:80;
        proxy_pass $supplier$request_uri;
        proxy_set_header Host $host;
    }
    location = /grafana {
        absolute_redirect off;
        return 302 /grafana/;
    }
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $rims_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
