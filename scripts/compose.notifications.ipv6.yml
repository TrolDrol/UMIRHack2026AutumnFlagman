# Optional provider egress only. Never enable IPv6 globally or recreate app networks.
# Resolve/verify the Telegram AAAA address before deploying this explicit override.
services:
  grafana:
    networks: [notification-egress]
    extra_hosts:
      api.telegram.org: ${RIMS_TELEGRAM_API_IPV6:?Set verified Telegram AAAA address}
networks:
  notification-egress:
    enable_ipv6: true
